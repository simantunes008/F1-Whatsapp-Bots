name: F1 Grid WhatsApp Bot

on:
  schedule:
    - cron: '17 * * * 5,6,0'
  workflow_dispatch:

jobs:
  run-grid-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore send state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: grid-state-${{ github.run_id }}
          restore-keys: grid-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run the grid bot
        env:
          ID_INSTANCE: ${{ secrets.ID_INSTANCE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python grid_bot.py

      - name: Save send state
        if: always() && hashFiles('.state/grid_sent.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: grid-state-${{ github.run_id }}
