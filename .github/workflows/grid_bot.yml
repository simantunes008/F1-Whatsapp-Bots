name: F1 Grid WhatsApp Bot

on:
  schedule:
    # De hora a hora, de sexta a domingo. A hora da qualificação varia muito
    # entre GPs (Las Vegas ~04:00 UTC, Bahrein ~16:00) e em fins de semana
    # sprint cai à sexta, por isso uma janela fixa não chega. O script sai
    # de imediato quando não há nada a fazer.
    - cron: '0 * * * 5,6,0'
  workflow_dispatch:

jobs:
  run-grid-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Guarda que rondas já foram enviadas, para que as execuções seguintes
      # do mesmo fim de semana não repitam a mensagem. Se a cache expirar, o
      # pior caso é um duplicado.
      - name: Restaurar estado de envios
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: grid-estado-${{ github.run_id }}
          restore-keys: grid-estado-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o bot da grelha
        env:
          ID_INSTANCE: ${{ secrets.ID_INSTANCE }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python grid_bot.py

      # Corre mesmo em falha: se a mensagem chegou a sair antes do erro, o
      # estado tem de ser preservado para não haver duplicado à hora seguinte.
      - name: Guardar estado de envios
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: grid-estado-${{ github.run_id }}
